# Runs the whole system on a fresh machine:   docker compose up --build
# Then open http://localhost:8080/swagger-ui.html  (or run scripts/smoke-test.sh)
#
# - db:  PostgreSQL
# - s3:  a local stand-in for Amazon S3 (Adobe S3Mock), so the app uses its real S3 storage code
#        path, the same one it uses on AWS. For development only: it keeps files in memory.
# - app: this project, built from the Dockerfile
#
# The passwords below are throw-away local-development defaults. Nothing here is used in AWS,
# where the database password comes from AWS Secrets Manager.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jazz
      POSTGRES_USER: jazz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jazz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jazz -d jazz"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: jazz-uploads
    ports:
      - "9090:9090"

  app:
    image: jazz-analyzer:local
    build:
      context: .
      args:
        # override these to build through a registry mirror: MAVEN_IMAGE=... JRE_IMAGE=... docker compose up --build
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-21}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre-alpine}
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: s3
      DB_URL: jdbc:postgresql://db:5432/jazz
      DB_USER: jazz
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jazz}
      S3_BUCKET: jazz-uploads
      S3_ENDPOINT: http://s3:9090
      S3_PATH_STYLE: "true"
      AWS_REGION: us-east-1
      # the S3 stand-in accepts any credentials; real AWS uses the task's IAM role instead
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8080:8080"

volumes:
  pgdata:
