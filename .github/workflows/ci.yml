name: CI

# Every push and pull request: run the tests, check coverage, build the image, and smoke-test the whole system.
# A push to main that passes all of that is also deployed to AWS (the last job), if AWS has been set up.
on:
  push:
  pull_request:

permissions:
  contents: read

# A branch with an open pull request triggers both a "push" and a "pull_request" run. Grouping by the branch name
# makes the second one replace the first instead of running everything twice. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Runs every test (the integration tests start PostgreSQL with Testcontainers, which the runner's
      # Docker supports), writes the JaCoCo report, and fails the build if the music engine
      # (the domain and analysis packages) has less than 80% line coverage.
      - name: Build, test and check coverage
        run: mvn -B verify

      - name: Show coverage in the job summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            {
              echo "### Line coverage by package"
              echo
              echo "| package | covered | total | % |"
              echo "|---|---:|---:|---:|"
              awk -F, 'NR>1 { miss[$2]+=$8; cov[$2]+=$9 }
                       END { for (p in miss) printf "| %s | %d | %d | %.1f |\n", p, cov[p], miss[p]+cov[p], 100*cov[p]/(miss[p]+cov[p]) }' \
                  target/site/jacoco/jacoco.csv | sort
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Upload test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

  docker:
    name: Docker image and full-system smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds the image from the Dockerfile, starts the app + PostgreSQL + the S3 stand-in with
      # Docker Compose, and drives the real HTTP API (upload, analyse, search, delete).
      - name: Start the whole system
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8080

      - name: Show the logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the system
        if: always()
        run: docker compose down --volumes

  badge:
    name: Update the coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # this job commits the generated badge file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
      - uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-coverage-badge: true
      - name: Commit the badge if it changed
        run: |
          if [ -n "$(git status --porcelain .github/badges)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi

  deploy:
    name: Deploy to AWS
    needs: [test, docker]
    # Only a push to main, and only once AWS has been set up (see docs/AWS_DEPLOYMENT.md): until the
    # repository variable AWS_DEPLOY_ROLE_ARN exists this job is skipped, so CI stays green without AWS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production     # in GitHub's settings you can require a manual approval for this environment
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write           # lets the job ask GitHub for an OIDC token: there are NO long-lived AWS keys
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS with OIDC (no stored access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image (tagged with the commit)
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          # tags in ECR are immutable, so a re-run of the same commit must not push again
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image $IMAGE already exists; skipping the push."
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      - name: Get the current task definition
        run: aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query taskDefinition > task-definition.json

      - name: Point the task definition at the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS and wait until it is stable
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Smoke test the live service
        if: vars.APP_URL != ''
        run: scripts/smoke-test.sh "${{ vars.APP_URL }}"
