# Maps MusicXML <kind> values to our internal chord quality.
#
# Format:  musicxml-kind = QUALITY[,extension]
#   QUALITY   a ChordQuality enum name (see domain/ChordQuality.java)
#   extension optional highest natural extension: 9, 11 or 13
#
# Reference: MusicXML 4.0 "kind-value" list. Review and correct freely; unit tests
# in ChordKindTableTest and ChordClassifierTest pin the behaviour.
# Kinds not listed here (neapolitan, italian, french, german, pedal, power, tristan, other)
# fall back to UNKNOWN so that analysis can report them honestly.
# "none" (N.C.) is handled by the parser: it produces no chord.

# triads
major = MAJOR
minor = MINOR
augmented = AUGMENTED
diminished = DIMINISHED
suspended-second = SUS2
suspended-fourth = SUS4

# sixths
major-sixth = MAJOR6
minor-sixth = MINOR6

# sevenths
major-seventh = MAJOR7
minor-seventh = MINOR7
dominant = DOMINANT7
major-minor = MINOR_MAJOR7
half-diminished = HALF_DIMINISHED7
diminished-seventh = DIMINISHED7
augmented-seventh = AUGMENTED7

# extended chords (a 9th chord implies the 7th; 11th and 13th imply the lower extensions)
dominant-ninth = DOMINANT7,9
major-ninth = MAJOR7,9
minor-ninth = MINOR7,9
dominant-11th = DOMINANT7,11
major-11th = MAJOR7,11
minor-11th = MINOR7,11
dominant-13th = DOMINANT7,13
major-13th = MAJOR7,13
minor-13th = MINOR7,13
